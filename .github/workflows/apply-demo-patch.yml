name: Apply Demo Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Demo Mode patches
        run: |
          set -euo pipefail

          if test -f submodules/AuthorizationUI/Sources/DemoMode/DemoModeRootController.swift; then
            echo "Demo Mode is already installed."
            exit 0
          fi

          PATCH_DIR="$RUNNER_TEMP/telegram-demo-patches"
          mkdir -p "$PATCH_DIR"
          unzip telegram-ios-demo-mode-patch.zip -d "$PATCH_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git am "$PATCH_DIR"/0001-*.patch "$PATCH_DIR"/0002-*.patch
          git push origin "HEAD:${GITHUB_REF_NAME}"
