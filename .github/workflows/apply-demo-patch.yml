name: Apply Demo Studio V2 Compile Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Apply verified compile fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          ui_path = Path(
              "submodules/ChatListUI/Sources/DemoStudio/DemoStudioUI.swift"
          )
          ui = ui_path.read_text()

          old_push = """    func push(_ controller: ViewController) {
                  (self.navigationController as? NavigationController)?.pushViewController(controller)
              }
          """
          delegate_defaults = """    func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
              }

              func tableView(_ tableView: UITableView, titleForHeaderInSection section: Int) -> String? {
                  return nil
              }

              func tableView(_ tableView: UITableView, titleForFooterInSection section: Int) -> String? {
                  return nil
              }

              func tableView(
                  _ tableView: UITableView,
                  leadingSwipeActionsConfigurationForRowAt indexPath: IndexPath
              ) -> UISwipeActionsConfiguration? {
                  return nil
              }

              func tableView(
                  _ tableView: UITableView,
                  trailingSwipeActionsConfigurationForRowAt indexPath: IndexPath
              ) -> UISwipeActionsConfiguration? {
                  return nil
              }
          """

          if old_push in ui:
              ui = ui.replace(old_push, delegate_defaults, 1)
          elif delegate_defaults not in ui:
              raise SystemExit("DemoStudioUI.swift has an unexpected layout")

          ui_path.write_text(ui)

          chats_path = Path(
              "submodules/ChatListUI/Sources/DemoStudio/DemoChatsController.swift"
          )
          chats = chats_path.read_text()
          chats = chats.replace(
              "self.presentationData.theme.chatList.itemPrimaryTextColor",
              "self.presentationData.theme.list.itemPrimaryTextColor",
          )
          chats = chats.replace(
              "self.presentationData.theme.chatList.itemSecondaryTextColor",
              "self.presentationData.theme.list.itemSecondaryTextColor",
          )
          chats_path.write_text(chats)

          for relative_path in (
              "submodules/ChatListUI/Sources/DemoStudio/DemoOwnerProfileController.swift",
              "submodules/ChatListUI/Sources/DemoStudio/DemoProfileEditorController.swift",
          ):
              path = Path(relative_path)
              source = path.read_text()
              source = source.replace(
                  "\n        (self.navigationController as? NavigationController)?.popViewController(animated: true)",
                  "\n        let _ = (self.navigationController as? NavigationController)?.popViewController(animated: true)",
              )
              path.write_text(source)

          gift_path = Path(
              "submodules/TelegramUI/Components/Gifts/GiftViewScreen/"
              "Sources/GiftViewScreen.swift"
          )
          gift = gift_path.read_text()
          gift = gift.replace(
              "                    addGiftToDemoStudio(gift, controller: controller)",
              "                    self?.addGiftToDemoStudio(gift, controller: controller)",
          )
          gift = gift.replace(
              "                    self.addGiftToDemoStudio(gift, controller: controller)",
              "                    self?.addGiftToDemoStudio(gift, controller: controller)",
          )
          gift_path.write_text(gift)

          checks = {
              ui_path: (
                  "leadingSwipeActionsConfigurationForRowAt",
                  "trailingSwipeActionsConfigurationForRowAt",
                  "titleForHeaderInSection",
                  "titleForFooterInSection",
              ),
              chats_path: (
                  "theme.list.itemPrimaryTextColor",
                  "theme.list.itemSecondaryTextColor",
              ),
              gift_path: (
                  "self?.addGiftToDemoStudio(gift, controller: controller)",
              ),
          }
          for path, required_fragments in checks.items():
              source = path.read_text()
              for fragment in required_fragments:
                  if fragment not in source:
                      raise SystemExit(f"{path}: missing {fragment}")

          if "func push(_ controller: ViewController)" in ui_path.read_text():
              raise SystemExit("The conflicting push method is still present")
          PY

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            submodules/ChatListUI/Sources/DemoStudio \
            submodules/TelegramUI/Components/Gifts/GiftViewScreen/Sources/GiftViewScreen.swift

          if git diff --cached --quiet; then
            echo "Compile hotfix is already applied."
            exit 0
          fi

          git commit -m "Fix Demo Studio Swift compilation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
