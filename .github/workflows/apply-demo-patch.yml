name: Apply Demo Studio Sideload Launch Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Harden startup for sideloaded builds
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramUI/Sources/AppDelegate.swift")
          source = path.read_text()

          def replace_once_or_verify(old, new, label):
              global source
              if new in source:
                  return
              if old in source:
                  source = source.replace(old, new, 1)
              else:
                  raise SystemExit(f"Unexpected AppDelegate layout: {label}")

          old_session = """        let configuration = URLSessionConfiguration.background(withIdentifier: identifier)
                  configuration.sharedContainerIdentifier = appGroupName
                  configuration.isDiscretionary = false
          """
          new_session = """        let configuration = URLSessionConfiguration.background(withIdentifier: identifier)
                  if FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName) != nil {
                      configuration.sharedContainerIdentifier = appGroupName
                  }
                  configuration.isDiscretionary = false
          """

          replace_once_or_verify(
              old_session,
              new_session,
              "background URLSession",
          )

          old_container = """        guard let appGroupUrl = maybeAppGroupUrl else {
                      self.mainWindow?.presentNative(UIAlertController(title: nil, message: "Error 2", preferredStyle: .alert))
                      return true
                  }
          """
          new_container = """        let appGroupUrl: URL
                  if let maybeAppGroupUrl {
                      appGroupUrl = maybeAppGroupUrl
                  } else {
                      let fallbackRoot = FileManager.default.urls(
                          for: .applicationSupportDirectory,
                          in: .userDomainMask
                      ).first ?? FileManager.default.urls(
                          for: .documentDirectory,
                          in: .userDomainMask
                      )[0]
                      appGroupUrl = fallbackRoot.appendingPathComponent(
                          "TelegramSideloadContainer",
                          isDirectory: true
                      )
                      do {
                          try FileManager.default.createDirectory(
                              at: appGroupUrl,
                              withIntermediateDirectories: true,
                              attributes: nil
                          )
                      } catch {
                          self.window?.makeKeyAndVisible()
                          self.mainWindow?.presentNative(UIAlertController(
                              title: "Demo Studio",
                              message: "Не удалось создать локальное хранилище: \\(error.localizedDescription)",
                              preferredStyle: .alert
                          ))
                          return true
                      }
                  }
          """

          replace_once_or_verify(
              old_container,
              new_container,
              "App Group fallback",
          )

          source = source.replace(
              "    private var supportsSystemPushRegistration = true\n",
              "    private var supportsSystemPushRegistration = false\n",
              1,
          )
          replace_once_or_verify(
              """    private var pushRegistry: PKPushRegistry?
          """,
              """    private var pushRegistry: PKPushRegistry?
              private var supportsSystemPushRegistration = false
          """,
              "push capability state",
          )

          replace_once_or_verify(
              (
                  "        let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)\n"
                  "        \n"
                  "        let buildConfig = BuildConfig(baseAppBundleId: baseAppBundleId)\n"
              ),
              (
                  "        let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)\n"
                  "        self.supportsSystemPushRegistration = (\n"
                  "            maybeAppGroupUrl != nil\n"
                  '            && baseAppBundleId == "ph.telegra.Telegraph"\n'
                  "        )\n"
                  "        \n"
                  "        let buildConfig = BuildConfig(baseAppBundleId: baseAppBundleId)\n"
              ),
              "App Group capability detection",
          )

          replace_once_or_verify(
              """        }, requestSiriAuthorization: { completion in
                      if #available(iOS 10, *) {
          """,
              """        }, requestSiriAuthorization: { completion in
                      if #available(iOS 10, *), buildConfig.isSiriEnabled {
          """,
              "Siri capability guard",
          )

          replace_once_or_verify(
              """        let pushRegistry = PKPushRegistry(queue: .main)
                  if #available(iOS 9.0, *) {
                      pushRegistry.desiredPushTypes = Set([.voIP])
                  }
                  self.pushRegistry = pushRegistry
                  pushRegistry.delegate = self
          """,
              """        if self.supportsSystemPushRegistration {
                      let pushRegistry = PKPushRegistry(queue: .main)
                      if #available(iOS 9.0, *) {
                          pushRegistry.desiredPushTypes = Set([.voIP])
                      }
                      self.pushRegistry = pushRegistry
                      pushRegistry.delegate = self
                  }
          """,
              "PushKit capability guard",
          )

          replace_once_or_verify(
              "                    self.resetIntentsIfNeeded(context: context.context)\n",
              (
                  "                    if buildConfig.isSiriEnabled {\n"
                  "                        self.resetIntentsIfNeeded(context: context.context)\n"
                  "                    }\n"
              ),
              "Siri interaction reset guard",
          )

          replace_once_or_verify(
              """        if #available(iOS 12.0, *) {
                      UIApplication.shared.registerForRemoteNotifications()
                  }
          """,
              """        if #available(iOS 12.0, *) {
                      self.registerForRemoteNotificationsIfAvailable()
                  }
          """,
              "startup APNs guard",
          )

          replace_once_or_verify(
              """    func requestNotificationTokenInvalidation() {
                  UIApplication.shared.unregisterForRemoteNotifications()
                  DispatchQueue.main.asyncAfter(deadline: DispatchTime.now() + 1.0, execute: {
                      UIApplication.shared.registerForRemoteNotifications()
                  })
              }
              
              private func registerForNotifications(context: AccountContextImpl, authorize: Bool = true, completion: @escaping (Bool) -> Void = { _ in }) {
          """,
              """    func requestNotificationTokenInvalidation() {
                  UIApplication.shared.unregisterForRemoteNotifications()
                  DispatchQueue.main.asyncAfter(deadline: DispatchTime.now() + 1.0, execute: {
                      self.registerForRemoteNotificationsIfAvailable()
                  })
              }

              private func registerForRemoteNotificationsIfAvailable() {
                  guard self.supportsSystemPushRegistration else {
                      Logger.shared.log("App \\(self.episodeId)", "Skipping remote notification registration without an application group")
                      return
                  }
                  UIApplication.shared.registerForRemoteNotifications()
              }
              
              private func registerForNotifications(context: AccountContextImpl, authorize: Bool = true, completion: @escaping (Bool) -> Void = { _ in }) {
          """,
              "APNs registration helper",
          )

          authorized_log = (
              '                                Logger.shared.log("App '
              '\\(self.episodeId)", "register for notifications: '
              'invoke registerForRemoteNotifications")\n'
          )
          replace_once_or_verify(
              authorized_log
              + "                                UIApplication.shared.registerForRemoteNotifications()",
              authorized_log
              + "                                self.registerForRemoteNotificationsIfAvailable()",
              "authorized APNs guard",
          )

          required = (
              "TelegramSideloadContainer",
              "if let maybeAppGroupUrl",
              "self.window?.makeKeyAndVisible()",
              "supportsSystemPushRegistration",
              "registerForRemoteNotificationsIfAvailable",
              "buildConfig.isSiriEnabled",
          )
          for fragment in required:
              if fragment not in source:
                  raise SystemExit(f"Missing expected launch fix: {fragment}")

          if 'message: "Error 2"' in source:
              raise SystemExit("The black-screen App Group exit is still present")

          path.write_text(source)
          PY

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add submodules/TelegramUI/Sources/AppDelegate.swift

          if git diff --cached --quiet; then
            echo "Sideload launch hotfix is already applied."
            exit 0
          fi

          git commit -m "Fix black screen in sideloaded builds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
