name: Apply Demo Studio Sideload Launch Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Add a local-container fallback for sideloaded builds
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramUI/Sources/AppDelegate.swift")
          source = path.read_text()

          old_session = """        let configuration = URLSessionConfiguration.background(withIdentifier: identifier)
                  configuration.sharedContainerIdentifier = appGroupName
                  configuration.isDiscretionary = false
          """
          new_session = """        let configuration = URLSessionConfiguration.background(withIdentifier: identifier)
                  if FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName) != nil {
                      configuration.sharedContainerIdentifier = appGroupName
                  }
                  configuration.isDiscretionary = false
          """

          if old_session in source:
              source = source.replace(old_session, new_session, 1)
          elif new_session not in source:
              raise SystemExit("Unexpected background URLSession layout")

          old_container = """        guard let appGroupUrl = maybeAppGroupUrl else {
                      self.mainWindow?.presentNative(UIAlertController(title: nil, message: "Error 2", preferredStyle: .alert))
                      return true
                  }
          """
          new_container = """        let appGroupUrl: URL
                  if let maybeAppGroupUrl {
                      appGroupUrl = maybeAppGroupUrl
                  } else {
                      let fallbackRoot = FileManager.default.urls(
                          for: .applicationSupportDirectory,
                          in: .userDomainMask
                      ).first ?? FileManager.default.urls(
                          for: .documentDirectory,
                          in: .userDomainMask
                      )[0]
                      appGroupUrl = fallbackRoot.appendingPathComponent(
                          "TelegramSideloadContainer",
                          isDirectory: true
                      )
                      do {
                          try FileManager.default.createDirectory(
                              at: appGroupUrl,
                              withIntermediateDirectories: true,
                              attributes: nil
                          )
                      } catch {
                          self.window?.makeKeyAndVisible()
                          self.mainWindow?.presentNative(UIAlertController(
                              title: "Demo Studio",
                              message: "Не удалось создать локальное хранилище: \\(error.localizedDescription)",
                              preferredStyle: .alert
                          ))
                          return true
                      }
                  }
          """

          if old_container in source:
              source = source.replace(old_container, new_container, 1)
          elif new_container not in source:
              raise SystemExit("Unexpected App Group guard layout")

          required = (
              "TelegramSideloadContainer",
              "if let maybeAppGroupUrl",
              "self.window?.makeKeyAndVisible()",
          )
          for fragment in required:
              if fragment not in source:
                  raise SystemExit(f"Missing expected launch fix: {fragment}")

          if 'message: "Error 2"' in source:
              raise SystemExit("The black-screen App Group exit is still present")

          path.write_text(source)
          PY

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add submodules/TelegramUI/Sources/AppDelegate.swift

          if git diff --cached --quiet; then
            echo "Sideload launch hotfix is already applied."
            exit 0
          fi

          git commit -m "Fix black screen in sideloaded builds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
