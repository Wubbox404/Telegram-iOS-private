name: Build Demo Studio V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-demo-studio-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 26 device IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out Telegram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Download official Telegram submodules
        run: |
          git config -f .gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c protocol.version=2 submodule update \
            --init --recursive --depth 1 --jobs 8

      - name: Select Xcode 26.2
        run: |
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Keep the compatible deployment target
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("Telegram/BUILD")
          source = path.read_text()
          source, replacements = re.subn(
              r'(?m)^minimum_os_version = "[^"]+"$',
              'minimum_os_version = "13.0"',
              source,
          )
          if replacements != 1:
              raise SystemExit(
                  f"Expected exactly one minimum_os_version assignment, got {replacements}"
              )
          path.write_text(source)
          PY
          grep -F 'minimum_os_version = "13.0"' Telegram/BUILD

      - name: Import the repository signing identity
        run: |
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning temp.keychain

      - name: Verify Demo Studio V2
        run: |
          test -f submodules/DemoStudioCore/Sources/DemoStudioStore.swift
          test -f submodules/ChatListUI/Sources/DemoStudio/DemoStudioController.swift
          test -f submodules/ChatListUI/Sources/DemoStudio/DemoStudioWatermarkView.swift
          test ! -d submodules/AuthorizationUI/Sources/DemoMode
          ! grep -R "DemoModeCredentials" submodules/AuthorizationUI/Sources

      - name: Build fake-signed device IPA
        env:
          TELEGRAM_BAZEL_CACHE: ${{ runner.temp }}/telegram-bazel-cache
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$TELEGRAM_BAZEL_CACHE" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64

      - name: Prepare artifact
        run: |
          mkdir -p build/artifacts
          for IPA_PATH in bazel-out/*/bin/Telegram/Telegram.ipa; do
            if [ -f "$IPA_PATH" ]; then
              cp "$IPA_PATH" build/artifacts/TelegramDemoStudioV2.ipa
              break
            fi
          done
          test -f build/artifacts/TelegramDemoStudioV2.ipa
          shasum -a 256 build/artifacts/TelegramDemoStudioV2.ipa \
            > build/artifacts/TelegramDemoStudioV2.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioV2-IPA
          path: |
            build/artifacts/TelegramDemoStudioV2.ipa
            build/artifacts/TelegramDemoStudioV2.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain temp.keychain || true
