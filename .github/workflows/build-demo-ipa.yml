name: Build Demo IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-demo-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 26 device IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out Telegram
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Download official Telegram submodules
        run: |
          git config --global \
            url."https://github.com/TelegramMessenger/".insteadOf \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/"

          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify Demo Mode
        run: |
          test -f submodules/AuthorizationUI/Sources/DemoMode/DemoModeRootController.swift
          test -f "submodules/TelegramUI/Images.xcassets/Demo Wallpaper.imageset/Contents.json"

      - name: Install Telegram build certificate
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/telegram-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import \
            build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Disable app extensions
        run: |
          printf '\nbuild --//Telegram:disableExtensions\n' >> .bazelrc

      - name: Set iOS 26 deployment target
        run: |
          sed -i '' \
            's/minimum_os_version = "13.0"/minimum_os_version = "26.0"/' \
            Telegram/BUILD

          grep -n 'minimum_os_version = ' Telegram/BUILD | head -1

      - name: Build device IPA
        env:
          TELEGRAM_BAZEL_CACHE: ${{ runner.temp }}/telegram-bazel-cache
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$TELEGRAM_BAZEL_CACHE" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64

      - name: Prepare IPA
        run: |
          test -f build/artifacts/Telegram.ipa
          cp build/artifacts/Telegram.ipa build/artifacts/TelegramDemo.ipa
          shasum -a 256 build/artifacts/TelegramDemo.ipa \
            > build/artifacts/TelegramDemo.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemo-IPA
          path: |
            build/artifacts/TelegramDemo.ipa
            build/artifacts/TelegramDemo.ipa.sha256
          if-no-files-found: error
          retention-days: 7
