      - name: Download official Telegram submodules
        run: |
          git config -f .gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c protocol.version=2 submodule update \
            --init --recursive --depth 1 --jobs 8

      - name: Harden the sideload application target
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("Telegram/BUILD")
          text = path.read_text()
          text, minimum_count = re.subn(
              r'(?m)^minimum_os_version = "[^"]+"$',
              'minimum_os_version = "13.0"',
              text,
          )
          if minimum_count != 1:
              raise SystemExit(
                  f"Expected one minimum_os_version assignment, got {minimum_count}"
              )

          text, extension_count = re.subn(
              r'''(?ms)(
                  bool_flag\(
                  \s+name\ =\ "disableExtensions",
                  \s+build_setting_default\ =\s*
              )(?:False|True)(
                  ,
                  \s+visibility\ =\ \["//visibility:public"\],
                  \s+\)
              )''',
              r"\g<1>True\g<2>",
              text,
              flags=re.VERBOSE,
          )
          if extension_count != 1:
              raise SystemExit(
                  f"Expected one disableExtensions assignment, got {extension_count}"
              )
          path.write_text(text)
          PY
          grep -F 'minimum_os_version = "13.0"' Telegram/BUILD
          grep -A3 -F 'name = "disableExtensions"' Telegram/BUILD |
            grep -F 'build_setting_default = True'

      - name: Create sideload-safe Telegram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import string
          from pathlib import Path

          source_path = Path("build-system/appstore-configuration.json")
          output_path = Path("build-system/sideload-configuration.json")
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip().lower()

          if not api_id.isdigit() or api_id == "8":
              raise SystemExit(
                  "Set repository secret TELEGRAM_API_ID to your custom numeric API ID"
              )
          if (
              len(api_hash) != 32
              or any(character not in string.hexdigits for character in api_hash)
              or api_hash == "7245de8e747a0d6fbe11f7cc14fcc0bb"
          ):
              raise SystemExit(
                  "Set repository secret TELEGRAM_API_HASH to your custom 32-character hash"
              )

          configuration = json.loads(source_path.read_text())
          configuration["api_id"] = api_id
          configuration["api_hash"] = api_hash
          configuration["is_internal_build"] = "true"
          configuration["is_appstore_build"] = "false"
          configuration["appstore_id"] = "0"
          configuration["premium_iap_product_id"] = ""
          configuration["enable_icloud"] = False
          configuration["enable_siri"] = False
          output_path.write_text(
              json.dumps(configuration, indent=2, sort_keys=True) + "\n"
          )

          verified = json.loads(output_path.read_text())
          required = {
              "api_id": api_id,
              "api_hash": api_hash,
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "enable_icloud": False,
              "enable_siri": False,
          }
          for key, expected in required.items():
              if verified.get(key) != expected:
                  raise SystemExit(f"Invalid runtime configuration field: {key}")
          PY

