                  fXNyfA0Zvor8/ppkd20J3U8Rj/xS5a+fZgyScOv/ATpuZbRrpQAA
                  """,
              ),
          ]
          for label, file_name, expected, encoded in artifacts:
              patch = gzip.decompress(
                  base64.b64decode("".join(encoded.split()))
              )
              actual = hashlib.sha256(patch).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"Embedded {label} patch checksum mismatch: {actual}"
                  )
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / file_name
              path.write_bytes(patch)
              print(f"Verified embedded {label} patch: {actual}")
          PY

          if grep -Fq "action = .starGiftUnique(" \
              submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift \
            && grep -Fq "if !isDemoStudioPeer && (" \
              submodules/TelegramUI/Sources/ChatHistoryViewForLocation.swift \
            && grep -Fq "let previousDocument = self.documentValue" \
              submodules/DemoStudioCore/Sources/DemoStudioStore.swift \
            && grep -Fq "current.removeValue(forKey: peerId)" \
              submodules/TelegramCore/Sources/TelegramEngine/Payments/StarGifts.swift \
            && ! grep -Fq 'preconditionFailure("debug tap")' \
              submodules/ChatListUI/Sources/ChatListController.swift; then
            echo "Native gift-card V4 patch is already present."
            echo "applied=false" >> "$GITHUB_OUTPUT"
          else
            if git apply --check \
                "$RUNNER_TEMP/demo-studio-native-gift-card-v4-from-v3.patch"; then
              echo "Applying the native gift-card upgrade over V3."
              git apply \
                "$RUNNER_TEMP/demo-studio-native-gift-card-v4-from-v3.patch"
            elif git apply --check \
                "$RUNNER_TEMP/demo-studio-native-gift-card-v4-from-prior.patch"; then
              echo "Applying V4 over the prior native stability state."
              git apply \
                "$RUNNER_TEMP/demo-studio-native-gift-card-v4-from-prior.patch"
            elif git apply --check \
                "$RUNNER_TEMP/demo-studio-native-gift-card-v4.patch"; then
              echo "Applying the complete V4 patch over the clean base."
              git apply \
                "$RUNNER_TEMP/demo-studio-native-gift-card-v4.patch"
            else
              echo "None of the verified V4 patch paths matches this tree."
              echo "The workflow stopped before changing source files."
              exit 1
            fi
            echo "applied=true" >> "$GITHUB_OUTPUT"
          fi

          git diff --check
          git diff --cached --check
          grep -F "if !isDemoStudioPeer && (" \
            submodules/TelegramUI/Sources/ChatHistoryViewForLocation.swift
          grep -F "nativeUniqueGiftData" \
            submodules/DemoStudioCore/Sources/DemoStudioModels.swift
          grep -F "LocalFileReferenceMediaResource" \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "action = .starGiftUnique(" \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "let previousDocument = self.documentValue" \
            submodules/DemoStudioCore/Sources/DemoStudioStore.swift
          grep -F "for byte in iconFileName.utf8" \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsListPanelComponent.swift
          grep -F "current.removeValue(forKey: peerId)" \
            submodules/TelegramCore/Sources/TelegramEngine/Payments/StarGifts.swift
          ! grep -Fq 'preconditionFailure("debug tap")' \
            submodules/ChatListUI/Sources/ChatListController.swift

      - name: Download official Telegram submodules
        run: |
          set -euo pipefail
          git config -f .gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c protocol.version=2 submodule update \
            --init --recursive --depth 1 --jobs 8

      - name: Select Xcode 26.2
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Parse every changed Swift source
        run: |
          set -euo pipefail
          grep '^+++ b/.*\.swift$' \
            "$RUNNER_TEMP/demo-studio-native-gift-card-v4.patch" |
            sed 's#^+++ b/##' |
            sort -u |
            while IFS= read -r source; do
              echo "Parsing $source"
              xcrun swiftc -parse "$source"
            done

      - name: Harden the sideload application target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("Telegram/BUILD")
          source = path.read_text()
          source, minimum_os_replacements = re.subn(
              r'(?m)^minimum_os_version = "[^"]+"$',
              'minimum_os_version = "13.0"',
              source,
          )
          if minimum_os_replacements != 1:
              raise SystemExit(
                  "Expected exactly one minimum_os_version assignment, "
                  f"got {minimum_os_replacements}"
              )

          source, extension_replacements = re.subn(
              r'''(?ms)(
                  bool_flag\(
                  \s+name\ =\ "disableExtensions",
                  \s+build_setting_default\ =\s*
              )(?:False|True)(
                  ,
                  \s+visibility\ =\ \["//visibility:public"\],
                  \s+\)
              )''',
              r"\g<1>True\g<2>",
              source,
              flags=re.VERBOSE,
          )
          if extension_replacements != 1:
              raise SystemExit(
                  "Expected exactly one disableExtensions default, "
                  f"got {extension_replacements}"
              )

          path.write_text(source)
          PY
          grep -F 'minimum_os_version = "13.0"' Telegram/BUILD
          grep -A3 -F 'name = "disableExtensions"' Telegram/BUILD |
            grep -F 'build_setting_default = True'

      - name: Create a sideload-safe runtime configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import string
          from pathlib import Path

          source_path = Path("build-system/appstore-configuration.json")
          output_path = Path("build-system/sideload-configuration.json")

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip().lower()

          if not api_id.isdigit() or api_id == "8":
              raise SystemExit("TELEGRAM_API_ID must be a custom numeric API ID")
          if (
              len(api_hash) != 32
              or any(character not in string.hexdigits for character in api_hash)
              or api_hash == "7245de8e747a0d6fbe11f7cc14fcc0bb"
          ):
              raise SystemExit(
                  "TELEGRAM_API_HASH must be a custom 32-character API hash"
              )

          configuration = json.loads(source_path.read_text())
          configuration["api_id"] = api_id
          configuration["api_hash"] = api_hash
          configuration["is_internal_build"] = "true"
          configuration["is_appstore_build"] = "false"
          configuration["appstore_id"] = "0"
          configuration["premium_iap_product_id"] = ""
          configuration["enable_icloud"] = False
          configuration["enable_siri"] = False
          output_path.write_text(
              json.dumps(configuration, indent=2, sort_keys=True) + "\n"
          )

          verified = json.loads(output_path.read_text())
          if verified["enable_icloud"] is not False:
              raise SystemExit("Sideload builds must not initialize CloudKit")
          if verified["enable_siri"] is not False:
              raise SystemExit("Sideload builds must not initialize Siri")
          if verified["api_id"] != api_id or verified["api_hash"] != api_hash:
              raise SystemExit("Custom Telegram API credentials were not written")
          if verified["is_internal_build"] != "true":
              raise SystemExit("Sideload builds must use internal build mode")
          if verified["is_appstore_build"] != "false":
              raise SystemExit("Sideload builds must not use App Store mode")
          PY
          grep -F '"enable_icloud": false' \
            build-system/sideload-configuration.json
          grep -F '"enable_siri": false' \
            build-system/sideload-configuration.json
          grep -F '"is_internal_build": "true"' \
            build-system/sideload-configuration.json
          grep -F '"is_appstore_build": "false"' \
            build-system/sideload-configuration.json

      - name: Restore persistent Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: telegram-demo-bazel-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-demo-bazel-${{ runner.os }}-${{ github.sha }}-
            telegram-demo-bazel-${{ runner.os }}-

      - name: Import the repository signing identity
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning temp.keychain

      - name: Verify native gift-card changes
        run: |
          set -euo pipefail
          test -f submodules/DemoStudioCore/Sources/DemoStudioStore.swift
          test -f submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "if !isDemoStudioPeer && (" \
            submodules/TelegramUI/Sources/ChatHistoryViewForLocation.swift
          grep -F "nativeUniqueGiftData" \
            submodules/DemoStudioCore/Sources/DemoStudioModels.swift
          grep -F "forceHidden: true" \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "action = .starGiftUnique(" \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "ChatMessageGiftBubbleContentNode" \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "bumpActivity: false" \
            submodules/DemoStudioCore/Sources/DemoStudioStore.swift
          grep -F "let previousDocument = self.documentValue" \
            submodules/DemoStudioCore/Sources/DemoStudioStore.swift
          grep -F "muteState: chat.isMuted" \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F "for byte in iconFileName.utf8" \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsListPanelComponent.swift
          grep -F "current.removeValue(forKey: peerId)" \
            submodules/TelegramCore/Sources/TelegramEngine/Payments/StarGifts.swift
          ! grep -Fq 'preconditionFailure("debug tap")' \
            submodules/ChatListUI/Sources/ChatListController.swift

      - name: Build fake-signed device IPA
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/sideload-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64

      - name: Save persistent Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Prepare artifact and debug symbols
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          IPA_PATH=""
          for CANDIDATE in bazel-out/*/bin/Telegram/Telegram.ipa; do
            if [ -f "$CANDIDATE" ]; then
              IPA_PATH="$CANDIDATE"
              break
            fi
          done
          test -n "$IPA_PATH"
          cp "$IPA_PATH" build/artifacts/TelegramDemoStudioV4.ipa

          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          unzip -q build/artifacts/TelegramDemoStudioV4.ipa -d "$CHECK_DIR"

          APP_PATH="$(
            find "$CHECK_DIR/Payload" \
              -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' \
              -print -quit
          )"
          test -n "$APP_PATH"
          test ! -d "$APP_PATH/PlugIns"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"
          file "$APP_PATH/$EXECUTABLE" | grep -F 'arm64'

          MINIMUM_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP_PATH/Info.plist"
          )"
          test "$MINIMUM_OS" = "13.0"

          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > build/artifacts/TelegramDemoStudioV4.entitlements.plist
          plutil -convert xml1 \
            build/artifacts/TelegramDemoStudioV4.entitlements.plist
          ! grep -F 'com.apple.developer.icloud-' \
            build/artifacts/TelegramDemoStudioV4.entitlements.plist
          ! grep -F 'com.apple.developer.ubiquity' \
            build/artifacts/TelegramDemoStudioV4.entitlements.plist
          ! grep -F 'com.apple.developer.siri' \
            build/artifacts/TelegramDemoStudioV4.entitlements.plist

          {
            echo "architecture=arm64"
            echo "minimum_os=$MINIMUM_OS"
            echo "extensions=disabled"
            echo "icloud=disabled"
            echo "siri=disabled"
            echo "patch=a09ea1bcb7a41c375456a3ebd8931d513c1b0c9208f1ffacff9f6afe5157b8c2"
          } > build/artifacts/TelegramDemoStudioV4.audit.txt

          shasum -a 256 build/artifacts/TelegramDemoStudioV4.ipa \
            > build/artifacts/TelegramDemoStudioV4.ipa.sha256

          DSYM_DIR="build/artifacts/dSYMs"
          mkdir -p "$DSYM_DIR"
          while IFS= read -r -d '' DSYM_PATH; do
            ditto "$DSYM_PATH" "$DSYM_DIR/$(basename "$DSYM_PATH")"
          done < <(find bazel-out -type d -name '*.dSYM' -prune -print0)
          if [ -n "$(find "$DSYM_DIR" -mindepth 1 -print -quit)" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$DSYM_DIR" \
              build/artifacts/TelegramDemoStudioV4-dSYMs.zip
          else
            echo "No dSYM directories were produced." \
              > build/artifacts/TelegramDemoStudioV4-dSYMs.txt
          fi
          rm -rf "$DSYM_DIR"

      - name: Upload IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioV4-IPA
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Commit the verified native gift-card patch
        if: steps.native_gift_card.outputs.applied == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add submodules
          git diff --cached --check
          git commit -m "Render Demo Studio gifts as native chat cards"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain temp.keychain || true
