          actual_hash = hashlib.sha256(snapshot).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"Source snapshot checksum mismatch: expected {expected_hash}, "
                  f"got {actual_hash}"
              )

          with tarfile.open(fileobj=io.BytesIO(snapshot), mode="r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected_files:
                  missing = sorted(expected_files - names)
                  unexpected = sorted(names - expected_files)
                  raise SystemExit(
                      f"Invalid source snapshot contents. Missing={missing}, "
                      f"unexpected={unexpected}"
                  )

              for member in members:
                  if not member.isfile():
                      raise SystemExit(
                          f"Non-regular snapshot member is forbidden: {member.name}"
                      )
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(
                          f"Unable to read snapshot member: {member.name}"
                      )
                  destination = Path(member.name)
                  if destination.is_symlink():
                      raise SystemExit(
                          f"Refusing to replace symlink: {member.name}"
                      )
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

