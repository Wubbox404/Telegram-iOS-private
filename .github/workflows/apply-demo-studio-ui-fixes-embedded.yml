          MINIMUM_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP_PATH/Info.plist"
          )"
          test "$MINIMUM_OS" = "13.0"

          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          plutil -convert xml1 \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          ! grep -F 'com.apple.developer.icloud-' \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          ! grep -F 'com.apple.developer.ubiquity' \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          ! grep -F 'com.apple.developer.siri' \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist

          {
            echo "architecture=arm64"
            echo "minimum_os=$MINIMUM_OS"
            echo "xcode=26.2"
            echo "extensions=disabled"
            echo "icloud=disabled"
            echo "siri=disabled"
            echo "source_snapshot_sha256=a3fb4d5e91cbb5694b0136e322a4814aa6a4ee0ff0c551bea60fbc59048d59d8"
            echo "source_commit=$(git rev-parse HEAD)"
          } > build/artifacts/TelegramDemoStudioDiagnosticsV5.audit.txt

          shasum -a 256 build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa \
            > build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa.sha256

      - name: Upload diagnostics IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioDiagnosticsV5-IPA
          path: |
            build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa
            build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa.sha256
            build/artifacts/TelegramDemoStudioDiagnosticsV5.audit.txt
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain temp.keychain || true
