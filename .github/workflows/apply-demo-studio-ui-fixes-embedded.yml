      - name: Verify final integration contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def source(path):
              value = Path(path)
              if not value.is_file():
                  raise SystemExit(f"Missing required source: {path}")
              return value.read_text()

          def require(path, *needles):
              text = source(path)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing invariant {needle!r}")

          def forbid(path, *needles):
              text = source(path)
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f"{path}: forbidden legacy code {needle!r}")

          require(
              "submodules/TelegramUI/Sources/ChatHistoryViewForLocation.swift",
              "let trackHoles = !isDemoStudioPeer",
