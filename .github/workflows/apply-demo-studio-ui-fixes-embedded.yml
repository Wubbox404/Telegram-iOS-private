      - name: Prepare and audit IPA
        run: |
          mkdir -p build/artifacts
          IPA_PATH=""
          for CANDIDATE in bazel-out/*/bin/Telegram/Telegram.ipa; do
            if [ -f "$CANDIDATE" ]; then
              IPA_PATH="$CANDIDATE"
              break
            fi
          done
          test -n "$IPA_PATH"
          cp "$IPA_PATH" build/artifacts/TelegramDemoStudioFinal.ipa

          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          unzip -q build/artifacts/TelegramDemoStudioFinal.ipa \
            -d "$CHECK_DIR"

          APP_PATH="$(
            find "$CHECK_DIR/Payload" \
              -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' \
              -print -quit
          )"
          test -n "$APP_PATH"
          test ! -d "$APP_PATH/PlugIns"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"
          file "$APP_PATH/$EXECUTABLE" | grep -F 'arm64'

          MINIMUM_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP_PATH/Info.plist"
          )"
          test "$MINIMUM_OS" = "13.0"

          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          plutil -convert xml1 \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          ! grep -F 'com.apple.developer.icloud-' \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          ! grep -F 'com.apple.developer.ubiquity' \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          ! grep -F 'com.apple.developer.siri' \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist

          {
            echo "architecture=arm64"
            echo "minimum_os=$MINIMUM_OS"
            echo "xcode=26.2"
            echo "extensions=disabled"
            echo "icloud=disabled"
            echo "siri=disabled"
            echo "source_snapshot_sha256=56130df452815c171943f71fc19d0549d44ef9c960b44e26413d15c825300272"
            echo "source_commit=$(git rev-parse HEAD)"
          } > build/artifacts/TelegramDemoStudioFinal.audit.txt

          shasum -a 256 build/artifacts/TelegramDemoStudioFinal.ipa \
            > build/artifacts/TelegramDemoStudioFinal.ipa.sha256

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioFinal-IPA
          path: |
            build/artifacts/TelegramDemoStudioFinal.ipa
            build/artifacts/TelegramDemoStudioFinal.ipa.sha256
            build/artifacts/TelegramDemoStudioFinal.audit.txt
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain temp.keychain || true
