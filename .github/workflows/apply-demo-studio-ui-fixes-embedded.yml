name: Apply and Build Demo Studio Native

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-demo-studio-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Demo Studio IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out Telegram
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply embedded native-data update
        shell: bash
        env:
          INCREMENTAL_PATCH_GZIP_B64: ""
          COMBINED_PATCH_GZIP_B64: ""
        run: |
          set -euo pipefail

          INCREMENTAL_PATCH="${RUNNER_TEMP}/demo-studio-native-incremental.patch"
          COMBINED_PATCH="${RUNNER_TEMP}/demo-studio-native-combined.patch"

          decode_base64() {
            if base64 --decode </dev/null >/dev/null 2>&1; then
              base64 --decode
            else
              base64 -D
            fi
          }

          printf '%s' "${INCREMENTAL_PATCH_GZIP_B64}" |
            decode_base64 | gzip -dc > "${INCREMENTAL_PATCH}"
          printf '%s' "${COMBINED_PATCH_GZIP_B64}" |
            decode_base64 | gzip -dc > "${COMBINED_PATCH}"

          test "$(
            shasum -a 256 "${INCREMENTAL_PATCH}" | awk '{print $1}'
          )" = '6fc454c0655ceaefd5a0d64224a967e86050512994ab8755fca4cfbdd58140de'
          test "$(
            shasum -a 256 "${COMBINED_PATCH}" | awk '{print $1}'
          )" = '3a26e63095851bbb0d87395ac3bd87fc7ebed850ff72904635f7ee219e0ace13'

          ! grep -F 'b/.github/workflows/' "${INCREMENTAL_PATCH}"
          ! grep -F 'b/.github/workflows/' "${COMBINED_PATCH}"

          if test -f submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift &&
             grep -Fq 'Materializes the editable Demo Studio document as normal Postbox records' \
               submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift; then
            echo "Native Demo Studio update is already present."
          elif git apply --check "${INCREMENTAL_PATCH}"; then
            echo "Applying update over the current Demo Studio V2 source."
            git apply "${INCREMENTAL_PATCH}"
          elif git apply --check "${COMBINED_PATCH}"; then
            echo "Applying the combined UI and native-data update."
            git apply "${COMBINED_PATCH}"
          else
            echo "::error::Repository source does not match either supported Demo Studio base."
            echo "Current commit: $(git rev-parse --short HEAD)"
            git status --short
            exit 1
          fi

          test -f submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F 'DemoStudioPostboxBridge.shared.activate(context: context)' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioController.swift
          grep -F 'Namespaces.Peer.isDemoStudioUser(peerId)' \
            submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift
          grep -F 'case liveStreamPaidMessage' \
            submodules/DemoStudioCore/Sources/DemoStudioModels.swift
          grep -F 'transaction.kind?.title' \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift
          git diff --check

      - name: Commit the embedded update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            submodules/ChatListUI \
            submodules/DemoStudioCore \
            submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift \
            submodules/TelegramCore/Sources/SyncCore/SyncCore_Namespaces.swift \
            submodules/TelegramUI/Components/Gifts/GiftViewScreen \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen \
            submodules/TelegramUI/Sources/TelegramRootController.swift

          git diff --cached --check
          git commit -m "Use native Telegram data for Demo Studio"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Download official Telegram submodules
        shell: bash
        run: |
          set -euo pipefail

          git config -f .gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c protocol.version=2 submodule update \
            --init --recursive --depth 1 --jobs 8

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail

          test -d /Applications/Xcode_26.2.app
          sudo xcode-select --switch \
            /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Parse every changed Swift source
        shell: bash
        run: |
          set -euo pipefail

          xcrun swiftc -parse \
            submodules/ChatListUI/Sources/DemoStudio/DemoChatController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoProfileEditorController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoProfilesController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStarsController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift \
            submodules/ChatListUI/Sources/Node/ChatListNodeEntries.swift \
            submodules/DemoStudioCore/Sources/DemoStudioModels.swift \
            submodules/DemoStudioCore/Sources/DemoStudioStore.swift \
            submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift \
            submodules/TelegramCore/Sources/SyncCore/SyncCore_Namespaces.swift \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift \
            submodules/TelegramUI/Sources/TelegramRootController.swift

      - name: Harden the sideload application target
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("Telegram/BUILD")
          source = path.read_text()
          source, minimum_os_replacements = re.subn(
              r'(?m)^minimum_os_version = "[^"]+"$',
              'minimum_os_version = "13.0"',
              source,
          )
          if minimum_os_replacements != 1:
              raise SystemExit(
                  "Expected exactly one minimum_os_version assignment, "
                  f"got {minimum_os_replacements}"
              )

          source, extension_replacements = re.subn(
              r'''(?ms)(
                  bool_flag\(
                  \s+name\ =\ "disableExtensions",
                  \s+build_setting_default\ =\s*
              )(?:False|True)(
                  ,
                  \s+visibility\ =\ \["//visibility:public"\],
                  \s+\)
              )''',
              r"\g<1>True\g<2>",
              source,
              flags=re.VERBOSE,
          )
          if extension_replacements != 1:
              raise SystemExit(
                  "Expected exactly one disableExtensions default, "
                  f"got {extension_replacements}"
              )

          path.write_text(source)
          PY

          grep -F 'minimum_os_version = "13.0"' Telegram/BUILD
          grep -A3 -F 'name = "disableExtensions"' Telegram/BUILD |
            grep -F 'build_setting_default = True'

      - name: Create the sideload runtime configuration
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import string
          from pathlib import Path

          source_path = Path("build-system/appstore-configuration.json")
          output_path = Path("build-system/sideload-configuration.json")

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip().lower()

          if not api_id.isdigit() or api_id == "8":
              raise SystemExit(
                  "Set the numeric TELEGRAM_API_ID repository secret"
              )
          if (
              len(api_hash) != 32
              or any(character not in string.hexdigits for character in api_hash)
              or api_hash == "7245de8e747a0d6fbe11f7cc14fcc0bb"
          ):
              raise SystemExit(
                  "Set the 32-character TELEGRAM_API_HASH repository secret"
              )

          configuration = json.loads(source_path.read_text())
          configuration["api_id"] = api_id
          configuration["api_hash"] = api_hash
          configuration["is_internal_build"] = "true"
          configuration["is_appstore_build"] = "false"
          configuration["appstore_id"] = "0"
          configuration["premium_iap_product_id"] = ""
          configuration["enable_icloud"] = False
          configuration["enable_siri"] = False
          output_path.write_text(
              json.dumps(configuration, indent=2, sort_keys=True) + "\n"
          )

          verified = json.loads(output_path.read_text())
          if verified["api_id"] != api_id or verified["api_hash"] != api_hash:
              raise SystemExit("Custom Telegram API credentials were not written")
          if verified["enable_icloud"] is not False:
              raise SystemExit("CloudKit must stay disabled for sideloading")
          if verified["enable_siri"] is not False:
              raise SystemExit("Siri must stay disabled for sideloading")
          PY

      - name: Restore persistent Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: telegram-demo-native-${{ runner.os }}-xcode26-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-demo-native-${{ runner.os }}-xcode26-
            telegram-demo-bazel-${{ runner.os }}-

      - name: Import the repository signing identity
        shell: bash
        run: |
          set -euo pipefail

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning temp.keychain

      - name: Verify native Demo Studio integration
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F 'transaction.updatePeersInternal' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F 'transaction.addMessages' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F 'TelegramMediaPoll(' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F 'data.withUpdatedStarRating' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          grep -F 'data.withUpdatedSavedMusic' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift
          test ! -d submodules/AuthorizationUI/Sources/DemoMode
          grep -F 'TelegramSideloadContainer' \
            submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Build fake-signed device IPA
        shell: bash
        run: |
          set -euo pipefail

          python3 -u build-system/Make/Make.py \
            --cacheDir="${RUNNER_TEMP}/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/sideload-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64

      - name: Save persistent Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Prepare and audit IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/artifacts
          for IPA_PATH in bazel-out/*/bin/Telegram/Telegram.ipa; do
            if test -f "${IPA_PATH}"; then
              cp "${IPA_PATH}" \
                build/artifacts/TelegramDemoStudioNative.ipa
              break
            fi
          done
          test -f build/artifacts/TelegramDemoStudioNative.ipa

          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "${CHECK_DIR}"' EXIT
          unzip -q build/artifacts/TelegramDemoStudioNative.ipa \
            -d "${CHECK_DIR}"

          APP_PATH="$(
            find "${CHECK_DIR}/Payload" \
              -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' \
              -print -quit
          )"
          test -n "${APP_PATH}"
          test ! -d "${APP_PATH}/PlugIns"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "${APP_PATH}/Info.plist"
          )"
          file "${APP_PATH}/${EXECUTABLE}" | grep -F 'arm64'

          MINIMUM_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "${APP_PATH}/Info.plist"
          )"
          test "${MINIMUM_OS}" = "13.0"
          codesign --verify --strict "${APP_PATH}"

          codesign -d --entitlements :- "${APP_PATH}" \
            > build/artifacts/TelegramDemoStudioNative.entitlements.plist
          plutil -convert xml1 \
            build/artifacts/TelegramDemoStudioNative.entitlements.plist
          ! grep -F 'com.apple.developer.icloud-' \
            build/artifacts/TelegramDemoStudioNative.entitlements.plist
          ! grep -F 'com.apple.developer.ubiquity' \
            build/artifacts/TelegramDemoStudioNative.entitlements.plist
          ! grep -F 'com.apple.developer.siri' \
            build/artifacts/TelegramDemoStudioNative.entitlements.plist

          {
            echo "architecture=arm64"
            echo "minimum_os=${MINIMUM_OS}"
            echo "extensions=disabled"
            echo "icloud=disabled"
            echo "siri=disabled"
            echo "native_demo_studio=enabled"
          } > build/artifacts/TelegramDemoStudioNative.audit.txt

          shasum -a 256 build/artifacts/TelegramDemoStudioNative.ipa \
            > build/artifacts/TelegramDemoStudioNative.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioNative-IPA
          path: |
            build/artifacts/TelegramDemoStudioNative.ipa
            build/artifacts/TelegramDemoStudioNative.ipa.sha256
            build/artifacts/TelegramDemoStudioNative.audit.txt
            build/artifacts/TelegramDemoStudioNative.entitlements.plist
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain temp.keychain || true
