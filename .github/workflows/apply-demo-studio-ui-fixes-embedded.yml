          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import string
          from pathlib import Path

          source_path = Path("build-system/appstore-configuration.json")
          output_path = Path("build-system/sideload-configuration.json")
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip().lower()

          if not api_id.isdigit() or api_id == "8":
              raise SystemExit(
                  "Set repository secret TELEGRAM_API_ID to your custom numeric API ID"
              )
          if (
              len(api_hash) != 32
              or any(character not in string.hexdigits for character in api_hash)
              or api_hash == "7245de8e747a0d6fbe11f7cc14fcc0bb"
          ):
              raise SystemExit(
                  "Set repository secret TELEGRAM_API_HASH to your custom 32-character hash"
              )

          configuration = json.loads(source_path.read_text())
          configuration["api_id"] = api_id
          configuration["api_hash"] = api_hash
          configuration["is_internal_build"] = "true"
          configuration["is_appstore_build"] = "false"
          configuration["appstore_id"] = "0"
          configuration["premium_iap_product_id"] = ""
          configuration["enable_icloud"] = False
          configuration["enable_siri"] = False
          output_path.write_text(
              json.dumps(configuration, indent=2, sort_keys=True) + "\n"
          )

          verified = json.loads(output_path.read_text())
          required = {
              "api_id": api_id,
              "api_hash": api_hash,
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "enable_icloud": False,
              "enable_siri": False,
          }
          for key, expected in required.items():
              if verified.get(key) != expected:
                  raise SystemExit(f"Invalid runtime configuration field: {key}")
          PY

