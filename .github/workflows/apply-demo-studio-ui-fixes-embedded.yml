      - name: Select Xcode 26.2
        run: |
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"

      - name: Parse every changed Swift source
        run: |
          set -euo pipefail
          while IFS= read -r FILE; do
            test -f "$FILE"
            echo "Parsing $FILE"
            xcrun swiftc -frontend -parse "$FILE" >/dev/null
          done <<'FILES'
          submodules/ChatListUI/Sources/ChatListControllerNode.swift
          submodules/ChatListUI/Sources/DemoStudio/DemoOwnerProfileController.swift
          submodules/ChatListUI/Sources/DemoStudio/DemoProfileEditorController.swift
          submodules/ChatListUI/Sources/DemoStudio/DemoProfilesController.swift
