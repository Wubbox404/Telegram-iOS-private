      - name: Download official Telegram submodules
        run: |
          git config -f .gitmodules submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c protocol.version=2 submodule update \
            --init --recursive --depth 1 --jobs 8

      - name: Harden the sideload application target
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("Telegram/BUILD")
          text = path.read_text()
          text, minimum_count = re.subn(
              r'(?m)^minimum_os_version = "[^"]+"$',
              'minimum_os_version = "13.0"',
              text,
          )
          if minimum_count != 1:
              raise SystemExit(
                  f"Expected one minimum_os_version assignment, got {minimum_count}"
              )

          text, extension_count = re.subn(
              r'''(?ms)(
                  bool_flag\(
                  \s+name\ =\ "disableExtensions",
                  \s+build_setting_default\ =\s*
              )(?:False|True)(
                  ,
                  \s+visibility\ =\ \["//visibility:public"\],
                  \s+\)
              )''',
              r"\g<1>True\g<2>",
              text,
              flags=re.VERBOSE,
          )
          if extension_count != 1:
              raise SystemExit(
                  f"Expected one disableExtensions assignment, got {extension_count}"
              )
          path.write_text(text)
          PY
          grep -F 'minimum_os_version = "13.0"' Telegram/BUILD
          grep -A3 -F 'name = "disableExtensions"' Telegram/BUILD |
            grep -F 'build_setting_default = True'

      - name: Create sideload-safe Telegram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import string
          from pathlib import Path

          source_path = Path("build-system/appstore-configuration.json")
          output_path = Path("build-system/sideload-configuration.json")
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip().lower()

          if not api_id.isdigit() or api_id == "8":
              raise SystemExit(
                  "Set repository secret TELEGRAM_API_ID to your custom numeric API ID"
              )
          if (
              len(api_hash) != 32
              or any(character not in string.hexdigits for character in api_hash)
              or api_hash == "7245de8e747a0d6fbe11f7cc14fcc0bb"
          ):
              raise SystemExit(
                  "Set repository secret TELEGRAM_API_HASH to your custom 32-character hash"
              )

          configuration = json.loads(source_path.read_text())
          configuration["api_id"] = api_id
          configuration["api_hash"] = api_hash
          configuration["is_internal_build"] = "true"
          configuration["is_appstore_build"] = "false"
          configuration["appstore_id"] = "0"
          configuration["premium_iap_product_id"] = ""
          configuration["enable_icloud"] = False
          configuration["enable_siri"] = False
          output_path.write_text(
              json.dumps(configuration, indent=2, sort_keys=True) + "\n"
          )

          verified = json.loads(output_path.read_text())
          required = {
              "api_id": api_id,
              "api_hash": api_hash,
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "enable_icloud": False,
              "enable_siri": False,
          }
          for key, expected in required.items():
              if verified.get(key) != expected:
                  raise SystemExit(f"Invalid runtime configuration field: {key}")
          PY

      - name: Restore persistent Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: telegram-demo-final-${{ runner.os }}-xcode26.2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-demo-final-${{ runner.os }}-xcode26.2-${{ github.sha }}-
            telegram-demo-final-${{ runner.os }}-xcode26.2-
            telegram-demo-bazel-${{ runner.os }}-

      - name: Import repository signing identity
        run: |
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning temp.keychain

      - name: Build fake-signed device IPA
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/sideload-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64

      - name: Save persistent Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Commit verified source patch
        run: |
          git add -- \
            submodules/ChatListUI/Sources/ChatListControllerNode.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoOwnerProfileController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoProfileEditorController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoProfilesController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStarsController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioController.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioPostboxBridge.swift \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioUI.swift \
            submodules/ChatListUI/Sources/Node/ChatListNode.swift \
            submodules/ChatListUI/Sources/Node/ChatListNodeEntries.swift \
            submodules/DemoStudioCore/Sources/DemoStudioModels.swift \
            submodules/TelegramUI/Components/Gifts/GiftViewScreen/Sources/GiftViewScreen.swift \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoData.swift \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderNode.swift \
            submodules/TelegramUI/Sources/ChatHistoryViewForLocation.swift \
            submodules/TelegramUI/Sources/TelegramRootController.swift

          if git diff --cached --quiet; then
            echo "Verified source patch was already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Finalize native Demo Studio integration"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare and audit IPA
        run: |
          mkdir -p build/artifacts
          IPA_PATH=""
          for CANDIDATE in bazel-out/*/bin/Telegram/Telegram.ipa; do
            if [ -f "$CANDIDATE" ]; then
              IPA_PATH="$CANDIDATE"
              break
            fi
          done
          test -n "$IPA_PATH"
          cp "$IPA_PATH" build/artifacts/TelegramDemoStudioFinal.ipa

          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          unzip -q build/artifacts/TelegramDemoStudioFinal.ipa \
            -d "$CHECK_DIR"

          APP_PATH="$(
            find "$CHECK_DIR/Payload" \
              -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' \
              -print -quit
          )"
          test -n "$APP_PATH"
          test ! -d "$APP_PATH/PlugIns"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"
          file "$APP_PATH/$EXECUTABLE" | grep -F 'arm64'

          MINIMUM_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP_PATH/Info.plist"
          )"
          test "$MINIMUM_OS" = "13.0"

          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          plutil -convert xml1 \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          ! grep -F 'com.apple.developer.icloud-' \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          ! grep -F 'com.apple.developer.ubiquity' \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          ! grep -F 'com.apple.developer.siri' \
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist

          {
            echo "architecture=arm64"
            echo "minimum_os=$MINIMUM_OS"
            echo "xcode=26.2"
            echo "extensions=disabled"
            echo "icloud=disabled"
            echo "siri=disabled"
            echo "patch_sha256=b50729a1eea26712aacb2aceab7c9828eb138d4b96d9d1be95763fe80104c4cc"
            echo "source_commit=$(git rev-parse HEAD)"
          } > build/artifacts/TelegramDemoStudioFinal.audit.txt

          shasum -a 256 build/artifacts/TelegramDemoStudioFinal.ipa \
            > build/artifacts/TelegramDemoStudioFinal.ipa.sha256

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioFinal-IPA
          path: |
            build/artifacts/TelegramDemoStudioFinal.ipa
            build/artifacts/TelegramDemoStudioFinal.ipa.sha256
            build/artifacts/TelegramDemoStudioFinal.audit.txt
            build/artifacts/TelegramDemoStudioFinal.entitlements.plist
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain temp.keychain || true
