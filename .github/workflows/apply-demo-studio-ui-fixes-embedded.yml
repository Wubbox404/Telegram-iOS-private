name: Apply Demo Studio UI Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decode and apply verified patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_GZIP_B64=''
          PATCH_FILE="${RUNNER_TEMP}/demo-studio-ui-fixes.patch"

          printf '%s' "${PATCH_GZIP_B64}" | base64 --decode | gzip --decompress > "${PATCH_FILE}"
          printf '%s  %s\n' \
            'f5d3952db0a314794b80bc2fad3385849609f580133b49ea6d2ca2c84fa10f57' \
            "${PATCH_FILE}" | sha256sum --check -

          test -f submodules/ChatListUI/Sources/DemoStudio/DemoStudioUI.swift
          test -f submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderNode.swift
          test -f submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift

          git apply --check "${PATCH_FILE}"
          git apply "${PATCH_FILE}"

          grep -F 'private var tableNode: ASDisplayNode?' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStudioUI.swift
          grep -F 'title: "Операция"' \
            submodules/ChatListUI/Sources/DemoStudio/DemoStarsController.swift
          grep -F 'demoStarsBalancePresentation()' \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift
          grep -F 'import DemoStudioCore' \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift
          ! grep -F 'var demoButton:' \
            submodules/ChatListUI/Sources/ChatListController.swift

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            submodules/ChatListUI \
            submodules/TelegramUI/Components/Gifts/GiftStoreScreen \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen \
            submodules/TelegramUI/Components/Stars/StarsTransactionsScreen

          git commit -m "Fix Demo Studio layout profile and stars"
          git push
