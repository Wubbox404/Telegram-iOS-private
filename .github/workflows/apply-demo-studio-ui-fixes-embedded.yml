            echo "Verified source patch was already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add comprehensive Demo Studio diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare and audit IPA
        run: |
          mkdir -p build/artifacts
          IPA_PATH=""
          for CANDIDATE in bazel-out/*/bin/Telegram/Telegram.ipa; do
            if [ -f "$CANDIDATE" ]; then
              IPA_PATH="$CANDIDATE"
              break
            fi
          done
          test -n "$IPA_PATH"
          cp "$IPA_PATH" build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa

          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          unzip -q build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa \
            -d "$CHECK_DIR"

          APP_PATH="$(
            find "$CHECK_DIR/Payload" \
              -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' \
              -print -quit
          )"
          test -n "$APP_PATH"
          test ! -d "$APP_PATH/PlugIns"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"
          file "$APP_PATH/$EXECUTABLE" | grep -F 'arm64'

          MINIMUM_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP_PATH/Info.plist"
          )"
          test "$MINIMUM_OS" = "13.0"

          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          plutil -convert xml1 \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          ! grep -F 'com.apple.developer.icloud-' \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          ! grep -F 'com.apple.developer.ubiquity' \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          ! grep -F 'com.apple.developer.siri' \
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist

          {
            echo "architecture=arm64"
            echo "minimum_os=$MINIMUM_OS"
            echo "xcode=26.2"
            echo "extensions=disabled"
            echo "icloud=disabled"
            echo "siri=disabled"
            echo "source_snapshot_sha256=a3fb4d5e91cbb5694b0136e322a4814aa6a4ee0ff0c551bea60fbc59048d59d8"
            echo "source_commit=$(git rev-parse HEAD)"
          } > build/artifacts/TelegramDemoStudioDiagnosticsV5.audit.txt

          shasum -a 256 build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa \
            > build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa.sha256

      - name: Upload diagnostics IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDemoStudioDiagnosticsV5-IPA
          path: |
            build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa
            build/artifacts/TelegramDemoStudioDiagnosticsV5.ipa.sha256
            build/artifacts/TelegramDemoStudioDiagnosticsV5.audit.txt
            build/artifacts/TelegramDemoStudioDiagnosticsV5.entitlements.plist
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain temp.keychain || true
